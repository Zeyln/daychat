[package]
name = "daychat"
version = "0.1.0"
edition = "2021"
description = "Lightweight, open, cleartext terminal chat with rotating daily IDs"
license = "MIT"

[[bin]]
name = "daychat-server"
path = "src/bin/server.rs"

[[bin]]
name = "daychat"
path = "src/bin/client.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
chrono = "0.4"
dirs = "5"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
unicode-width = "0.2"
